name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: ghumone-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.GHUMONE_APP_DIR || '/var/www/ghumone-api' }}"
            PM2_NAME="ghumone-api"

            echo "==> Deploying GhumoNE API in ${APP_DIR}"

            cd "${APP_DIR}"

            if [ ! -d .git ]; then
              echo "Repository not cloned yet. Clone it first (see DEPLOY.md)."
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npx prisma migrate deploy
            npm run build

            if pm2 describe "${PM2_NAME}" > /dev/null 2>&1; then
              pm2 restart "${PM2_NAME}" --update-env
            else
              pm2 start ecosystem.config.cjs
              pm2 save
            fi

            pm2 status "${PM2_NAME}"
            echo "==> Deploy complete"
