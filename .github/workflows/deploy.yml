name: Deploy to AltServer

on:
  push:
    branches:
      - main

concurrency:
  group: ghumone-api-production
  cancel-in-progress: true

jobs:
  build:
    name: Build on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Pack dist for deploy
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist

      - name: Upload dist tarball to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: dist.tar.gz
          target: /tmp

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -eo pipefail

            APP_DIR="${{ secrets.GHUMONE_APP_DIR || '/var/www/ghumone-api' }}"
            PM2_NAME="ghumone-api"

            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 24
            fi

            echo "==> Deploying GhumoNE API in ${APP_DIR}"
            echo "==> Node: $(node -v) | NPM: $(npm -v)"

            cd "${APP_DIR}"

            if [ ! -f .env ]; then
              echo "ERROR: .env file missing at ${APP_DIR}/.env"
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            unset NODE_ENV
            npm config delete production 2>/dev/null || true

            echo "==> Clean install (full deps, no build on VPS)..."
            rm -rf node_modules
            npm ci --ignore-scripts 2>&1 | tee /tmp/ghumone-npm-ci.log

            echo "==> Verifying dependencies..."
            test -f node_modules/@nestjs/common/index.js || {
              echo "ERROR: @nestjs/common not installed correctly"
              ls -la node_modules/@nestjs/common/ || true
              exit 1
            }

            echo "==> Generating Prisma client..."
            npx prisma generate 2>&1 | tee /tmp/ghumone-prisma.log

            echo "==> Running migrations..."
            npx prisma migrate deploy 2>&1 | tee /tmp/ghumone-migrate.log

            echo "==> Extracting pre-built dist from GitHub Actions..."
            rm -rf dist
            mkdir -p dist
            tar -xzf /tmp/dist.tar.gz -C dist
            rm -f /tmp/dist.tar.gz

            if [ ! -f dist/main.js ]; then
              echo "ERROR: dist/main.js not found after extract"
              ls -la dist/
              exit 1
            fi

            if pm2 describe "${PM2_NAME}" > /dev/null 2>&1; then
              pm2 restart "${PM2_NAME}" --update-env
            else
              pm2 start ecosystem.config.cjs
              pm2 save
            fi

            pm2 status "${PM2_NAME}"
            echo "==> Deploy complete (build ran on GitHub, not VPS)"
